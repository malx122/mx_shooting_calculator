# Cloudflare Worker for MX Shooting Calculator sync. See README.md here.
name = "mxsc-sync"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "mxsc-sync"
# From `npx wrangler d1 create mxsc-sync` (see README.md).
database_id = "71301240-75cf-453c-9b36-a89a5345c95b"
migrations_dir = "migrations"

[vars]
# The app's Google OAuth client (a web client). Its secret is a Worker
# secret: `npx wrangler secret put GOOGLE_CLIENT_SECRET`.
GOOGLE_CLIENT_ID = "223667274903-qu244apl6nvu5423gfifmma588fnrqk7.apps.googleusercontent.com"

# The largest the database may grow before new copies are refused, bytes,
# so that filling it can't stop the hunters already syncing: about 80 % of
# the plan's limit. 400 MB on the free plan (500 MB); on Workers Paid
# (10 GB), 8000000000.
MAX_DATABASE_BYTES = "400000000"

# Requests one IP address may make (Cloudflare's rate limiter: counted per
# data centre, nothing stored). The namespace ids only need to be unique
# within the account.
[[ratelimits]]
name = "NEW_COPY_LIMIT"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "GOOGLE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "REQUEST_LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# Clean-up every quarter of an hour: Google sign-ins nobody picked up, and
# copies unused for two years.
[triggers]
crons = ["*/15 * * * *"]
