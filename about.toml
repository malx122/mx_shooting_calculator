# Licences cargo-about accepts when it lists the dependencies in
# THIRD-PARTY-LICENSES.txt (run `cargo about generate about.hbs -o
# THIRD-PARTY-LICENSES.txt`). It fails on any licence not listed here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
# Only what ships in the macOS, Windows, Linux and web builds.
targets = [
    "wasm32-unknown-unknown",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
