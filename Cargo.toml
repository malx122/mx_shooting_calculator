[workspace]
resolver = "3"
members = ["crates/ballistics-core", "crates/ballistics-store", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["David Rosendahl"]

[workspace.dependencies]
ballistics-core = { path = "crates/ballistics-core" }
ballistics-store = { path = "crates/ballistics-store" }
