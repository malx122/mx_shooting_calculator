<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#12261A">
  <title>MX Shooting Calculator</title>
  <link data-trunk rel="rust" data-bin="mxsc" data-wasm-opt="z" />
  <link data-trunk rel="icon" href="assets/mxsc-icon.svg" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #12261A; }
    canvas#mxsc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #F1EADB; font: 15px/1.4 system-ui, sans-serif; letter-spacing: 0.04em; padding: 16px; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="mxsc"></canvas>
  <div id="loading">Loading MX Shooting Calculator…</div>
</body>
</html>
