[package]
name = "mxsc"
description = "MX Shooting Calculator: rifle ballistics for hunting and target shooting, with your own rifles and bullets."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mxsc"
path = "src/main.rs"

[dependencies]
ballistics-core.workspace = true
ballistics-store.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.17", features = ["file-handle-inner"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
ballistics-shot.workspace = true
sys-locale = { version = "0.3", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
ureq = "3"

# The web build (`trunk build` in this folder; see README).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "DeviceOrientationEvent",
    "Document",
    "Element",
    "File",
    "HtmlAnchorElement",
    "Headers",
    "History",
    "HtmlCanvasElement",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "Window",
] }
# SQLite's storage in the browser: IndexedDB.
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = "0.2"
# WebGL as well as WebGPU, for browsers without WebGPU.
wgpu = { version = "24", default-features = false, features = ["webgl", "webgpu", "wgsl"] }

[dev-dependencies]
serde_json = "1"
