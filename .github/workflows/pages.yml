# Builds the web version and publishes it on GitHub Pages for each release:
# a pushed version tag such as v0.1.0 (or by hand from the Actions tab).
name: Web version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Rust with the browser target and llvm-ar
        run: |
          rustup toolchain install stable --profile minimal \
            --target wasm32-unknown-unknown --component llvm-tools
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Build
        run: scripts/web.sh build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
