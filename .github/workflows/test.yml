# Tests everything on each push to main, on pull requests (Dependabot's
# among them), and before each release: the release workflows (desktop.yml,
# pages.yml, sync-server.yml) call this one first and publish nothing if it
# fails. It uses no secrets, so pull requests can run it safely.
#
# - Rust: formatting, the workspace's tests, clippy with warnings as errors
# - Windows: the desktop app compiles there
# - Dependencies: known security advisories, licences, sources (deny.toml)
# - Web: clippy for the browser build
# - Sync server: its tests, against a local worker
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/sign-update/Cargo.toml --check

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: The update signing tool builds
        run: cargo build --locked --manifest-path tools/sign-update/Cargo.toml

  # The desktop app compiles for Windows too: its graphics and system code
  # differ there, and a release builds it.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-windows

      - name: Check
        run: cargo check -p mxsc --all-targets --locked

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Advisories, licences and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust with the browser target and llvm-ar
        run: |
          rustup toolchain install stable --profile minimal \
            --target wasm32-unknown-unknown --component llvm-tools --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-wasm

      - name: Clippy for the browser build
        run: scripts/web.sh lint

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test
