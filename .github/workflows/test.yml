# Tests everything on each push to main, and before each release: the
# release workflows (desktop.yml, pages.yml, sync-server.yml) call this one
# first and publish nothing if it fails.
#
# - Rust: the workspace's tests, and clippy with warnings as errors
# - Web: clippy for the browser build
# - Sync server: its tests, against a local worker
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: The update signing tool builds
        run: cargo build --locked --manifest-path tools/sign-update/Cargo.toml

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust with the browser target and llvm-ar
        run: |
          rustup toolchain install stable --profile minimal \
            --target wasm32-unknown-unknown --component llvm-tools --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-wasm

      - name: Clippy for the browser build
        run: scripts/web.sh lint

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test
