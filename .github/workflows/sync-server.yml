# Deploys the sync server (server/) to Cloudflare Workers for each release
# tag, or by hand from the Actions tab. Needs the repository secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit and D1: Edit) and
# CLOUDFLARE_ACCOUNT_ID; without them the job says so and does nothing.
# GOOGLE_WEB_CLIENT_SECRET, when set, becomes the worker's
# GOOGLE_CLIENT_SECRET for Google sign-in.
name: Sync server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  # The server's own tests are among these.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      # The secrets go only to the steps that use them: not to npm's
      # install scripts or the tests.
      - name: Check for the Cloudflare secrets
        id: secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the sync server was not deployed."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Migrate the database and deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Google client secret
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_SECRET" ]; then
            echo "::notice::GOOGLE_WEB_CLIENT_SECRET is not set; Google sign-in keeps its secret as it is."
            exit 0
          fi
          printf '%s' "$GOOGLE_WEB_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
