# Builds the desktop apps for macOS (Apple silicon and Intel), Windows and
# Linux with scripts/package.sh, and attaches them to the GitHub release of
# each version tag such as v0.8.0. By hand from the Actions tab it builds
# them as downloadable artifacts, and with "release" set to an existing tag
# also attaches them to that tag's release, built from that tag (start it
# from the tag itself: the release environment admits only v* tags).
#
# The release job signs the update manifest the apps' updater trusts, so the
# chain to it is kept short: third-party actions pinned by commit, no build
# cache (a poisoned cache could slip into a signed release), write access
# only for the release job, and the signing key (the MXSC_UPDATE_KEY secret,
# best kept in the "release" environment limited to v* tags) only in the
# step that signs.
name: Desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Attach to the release of this tag (e.g. v0.7.0); empty for artifacts only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported runners, so the apps run on older systems too.
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release || github.ref }}

      - name: Check the tag matches the version in Cargo.toml
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        run: |
          [ -n "$TAG" ] || exit 0
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ runner.os }}
          path: dist-desktop/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      # Built before the key is anywhere near: its dependencies' build
      # scripts never see it.
      - name: Build the signing tool
        run: cargo build --release --locked --manifest-path tools/sign-update/Cargo.toml

      # What the apps' updater (crates/app/src/updates.rs) reads: the
      # version and each system's update file with its SHA-256, signed with
      # the key in the MXSC_UPDATE_KEY secret.
      - name: Signed update manifest
        env:
          MXSC_UPDATE_KEY: ${{ secrets.MXSC_UPDATE_KEY }}
        run: |
          if [ -z "$MXSC_UPDATE_KEY" ]; then
            echo "No MXSC_UPDATE_KEY secret: the apps won't be offered this release" >&2
            exit 0
          fi
          version=${TAG#v}
          file=MX-Shooting-Calculator-$version
          entry() {
            printf '"%s":{"name":"%s","sha256":"%s"}' "$1" "$2" \
              "$(sha256sum "dist/$2" | cut -d' ' -f1)"
          }
          printf '{"version":"%s","files":{%s,%s,%s}}\n' "$version" \
            "$(entry macos "$file-macos-update.tar.gz")" \
            "$(entry windows-x64 "$file-windows-x64-update.exe")" \
            "$(entry linux-x64 "$file-linux-x64-update")" >dist/update.json
          cat dist/update.json
          tools/sign-update/target/release/sign-update dist/update.json

      - name: Release notes from the changelog
        run: |
          version=${TAG#v}
          {
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            cat <<'NOTES'

          ### Downloads

          - **macOS** (Apple silicon and Intel, macOS 11 or later): open the `.dmg` and drag the app to Applications. The app isn't notarized yet: the first time, macOS refuses to open it; open **System Settings → Privacy & Security** and choose **Open Anyway**.
          - **Windows** (64-bit): unzip and run `MX Shooting Calculator.exe`. Windows SmartScreen may warn about an unknown publisher: choose **More info → Run anyway**.
          - **Linux** (x86-64): unpack, then run `./install.sh` for a menu entry, or `./mxsc` directly.
          - **Web and phones:** https://malx122.github.io/mx_shooting_calculator/

          The files ending in `-update`, and `update.json`, are for the desktop apps' own updater (menu → Updates).
          NOTES
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
