# Weekly pull requests that update dependencies: the Rust crates, the update
# signing tool's, the sync server's npm packages, and the GitHub actions the
# workflows pin by commit. The Tests workflow runs on each; merge the ones
# that pass. Minor and patch updates come grouped, one pull request per kind.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The UI library and what must stay on its versions: the wgpu the web
      # build names (eframe's), and resvg for the window icon
      # (egui_extras'). Updated together, in one pull request.
      egui:
        patterns: ["eframe", "egui*", "wgpu", "resvg"]
      rust:
        update-types: [minor, patch]
    ignore:
      # The web app's IndexedDB storage (crates/app/src/relaxed_idb.rs) is
      # written against this version's VFS API, and it must be the one
      # rusqlite uses: it moves with rusqlite, by hand, not on its own.
      - dependency-name: sqlite-wasm-rs
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: /tools/sign-update
    schedule:
      interval: weekly
    groups:
      sign-update:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
