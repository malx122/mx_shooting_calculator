# cargo-deny's checks on the dependencies; the Tests workflow runs
# `cargo deny check advisories licenses sources`.

[graph]
# Only what ships in the macOS, Windows, Linux and web builds (as about.toml).
targets = [
    "wasm32-unknown-unknown",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# A crate with a RustSec security advisory fails the check, as does an
# unmaintained or yanked one. To accept one, add its id here with why it
# can't affect the app.
ignore = [
    # paste (macros used while compiling wgpu's Metal backend): unmaintained,
    # no known flaw, and nothing of it runs in the app. Goes with a newer
    # eframe/wgpu.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macros in wgpu's Metal backend; goes with a newer eframe" },
    # ttf-parser: unmaintained, no known flaw. It reads only the fonts built
    # into the app (egui's and the cards'), never a file from outside.
    { id = "RUSTSEC-2026-0192", reason = "reads only the app's own embedded fonts" },
]

[licenses]
# The licences cargo-about accepts too (about.toml): permissive ones, fit to
# ship with an MIT OR Apache-2.0 app.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

[sources]
# Crates come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
